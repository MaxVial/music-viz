services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    build: ./api
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      - db

  db:
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - music-data:/data

volumes:
  music-data:
