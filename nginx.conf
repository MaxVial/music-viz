server {
    listen 80;

    # The page, the 3D scene, the scripts: plain files from web/
    location / {
        root /usr/share/nginx/html;
        # The browser must ask "has it changed?" before reusing its copy:
        # a new version of scene.js is seen at the next reload
        add_header Cache-Control "no-cache";
    }

    # /api/tracks -> http://api:5000/tracks (the Flask container)
    location /api/ {
        proxy_pass http://api:5000/;
    }

    # /covers/ID/maxresdefault.jpg -> https://i.ytimg.com/vi/ID/maxresdefault.jpg
    # The covers come from our own server, so WebGL accepts them as textures.
    location /covers/ {
        proxy_pass https://i.ytimg.com/vi/;
        proxy_ssl_server_name on;  # tell YouTube's HTTPS server which site we want
    }
}
