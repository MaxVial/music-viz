<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music-Vidz</title>
  <style>
    body { margin: 0; padding: 16px; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    #message { color: #f88; }
    #tracks { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    figure { margin: 0; }
    img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
    figcaption { font-size: 14px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Music-Vidz</h1>
  <p id="message">Chargement…</p>
  <div id="tracks"></div>

  <script>
    const message = document.getElementById("message");

    // Same server as the page: nginx sends /api/... to the Flask container
    fetch("/api/tracks")
      .then(reply => reply.json())
      .then(data => {
        if (data.error) {
          message.textContent = data.error;
          return;
        }
        message.textContent = data.warning ?? `${data.count} morceaux (Last.fm : ${data.lastfm})`;
        for (const track of data.tracks) {
          const figure = document.createElement("figure");
          const img = document.createElement("img");
          img.src = track.thumbnail;
          img.alt = `${track.artist} - ${track.title}`;
          const caption = document.createElement("figcaption");
          caption.textContent = `${track.artist} – ${track.title}`;
          const link = document.createElement("a");
          link.href = `https://youtu.be/${track.videoId}`;
          link.append(img);
          figure.append(link, caption);
          document.getElementById("tracks").append(figure);
        }
      })
      .catch(() => { message.textContent = "Le serveur ne répond pas."; });
  </script>
</body>
</html>
