<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music-Vidz</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070a; color: #eee; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    [hidden] { display: none !important; }

    button { font: inherit; padding: 12px 24px; border: 1px solid #eee; border-radius: 999px; background: rgba(0, 0, 0, .5); color: inherit; cursor: pointer; }
    button:hover { background: #eee; color: #05070a; }

    /* Entry screen: the click on its button allows the browser to play sound */
    #enter { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; justify-items: center; gap: 8px; padding: 16px; text-align: center; background: rgba(0, 0, 0, .8); }
    #enter h1 { margin: 0; font-size: clamp(32px, 8vw, 64px); }
    .error { color: #f88; }

    /* Current track + "next" button, at the bottom */
    #hud { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
    #now { margin: 0; text-shadow: 0 0 6px #000; }
    #now strong { display: block; font-size: 20px; }

    /* YouTube asks for a visible player of at least 200 x 200 px */
    #player-box { position: fixed; top: 16px; right: 16px; width: 356px; max-width: calc(100vw - 32px); height: 200px; opacity: .85; }
    /* Two players stacked at the same place: the one of the current track is on top */
    #player-box iframe { position: absolute; inset: 0; }
    #player-box .front { z-index: 1; }
  </style>

  <!-- Three.js comes from a CDN, version pinned: no npm, no build step -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <!-- Official YouTube player: it calls onYouTubeIframeAPIReady when it is loaded -->
  <script>
    window.youtubeReady = new Promise(resolve => { window.onYouTubeIframeAPIReady = resolve; });
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- ?v=... : change this number to force browsers to download a new scene.js -->
  <script type="module" src="scene.js?v=4"></script>
</head>
<body>
  <div id="enter">
    <h1>Music-Vidz</h1>
    <p id="status">Chargement de tes écoutes…</p>
    <button id="start" hidden>Entrer dans la forêt</button>
  </div>

  <div id="hud" hidden>
    <p id="now"></p>
    <button id="next">Suivant →</button>
  </div>

  <div id="player-box"><div id="player-a"></div><div id="player-b"></div></div>
</body>
</html>
